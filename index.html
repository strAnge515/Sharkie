<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkie</title>

    <link rel="stylesheet" href="./style.css" />

    <script src="./scripts/sounds.js"></script>
    <script src="./scripts/timers.js"></script>
    <script src="./scripts/statusBarImages.js"></script>
    <script src="./scripts/characterImages.js"></script>
    <script src="./scripts/classes/drawableObject.class.js"></script>
    <script src="./scripts/classes/statusbar.class.js"></script>
    <script src="./scripts/classes/moveableObject.class.js"></script>
    <script src="./scripts/classes/background.class.js"></script>
    <script src="./scripts/classes/character.class.js"></script>
    <script src="./scripts/classes/enemy.class.js"></script>
    <script src="./scripts/classes/bubble.class.js"></script>
    <script src="./scripts/classes/coin.class.js"></script>
    <script src="./scripts/classes/jellyfish.class.js"></script>
    <script src="./scripts/classes/poisonbottle.class.js"></script>
    <script src="./scripts/classes/finalenemy.class.js"></script>

    <script src="./scripts/classes/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./scripts/classes/collisionHandler.class.js"></script>
    <script src="./scripts/classes/world.class.js"></script>

    <script src="./scripts/classes/keyboard.class.js"></script>
    <script src="./scripts/game.js"></script>
  </head>
  <body onload="init()">
    <div class="canvas-wrapper">
      <canvas id="canvas" height="480" width="720"></canvas>

      <div class="touch-controls">
        <div class="touch-pad">
          <button class="touch-button touch-up" data-key="ArrowUp" aria-label="Hoch">&#9650;</button>
          <button class="touch-button touch-left" data-key="ArrowLeft" aria-label="Links">&#9664;</button>
          <button class="touch-button touch-right" data-key="ArrowRight" aria-label="Rechts">&#9654;</button>
          <button class="touch-button touch-down" data-key="ArrowDown" aria-label="Runter">&#9660;</button>
        </div>
        <div class="touch-actions">
          <button class="touch-button" data-key="d" aria-label="Schwanzattacke">D</button>
          <button class="touch-button" data-key=" " aria-label="Blase schießen">&#9675;</button>
        </div>
      </div>

      <section id="startScreen" class="screen start-screen">
        <h1 class="game-title">Sharkie</h1>
        <p class="story">
          Sharkie schwimmt durch das Meer. Weiche Kugelfischen und Quallen aus, sammle Münzen und Giftflaschen
          und besiege am Ende den riesigen Wal!
        </p>
        <button class="image-button" onclick="startGame()">
          <img class="start-image" src="graphics/6.Botones/Start/1.png" alt="Start" width="208" />
        </button>
        <button class="text-button" onclick="openControls()">Steuerung</button>
        <a class="impressum-link" href="impressum.html">Impressum</a>
      </section>

      <section id="endScreen" class="screen end-screen hidden">
        <img id="gameOverTitle" class="game-over-image" src="graphics/6.Botones/Tittles/Game Over/Recurso 9.png" alt="Game Over" width="480" />
        <img id="winTitle" class="win-image hidden" src="graphics/6.Botones/Tittles/You win/Recurso 19.png" alt="You win" width="400" />
        <button class="image-button" onclick="startGame()">
          <img class="try-again-image" src="graphics/6.Botones/Try again/Recurso 15.png" alt="Try again" width="260" />
        </button>
        <button class="text-button" onclick="backToMenu()">Hauptmenü</button>
      </section>

      <div class="corner-buttons">
        <button id="exitButton" class="round-button hidden" onclick="backToMenu()" aria-label="Zum Hauptmenü">&#10005;</button>
        <button class="round-button" onclick="openControls()" aria-label="Steuerung anzeigen">?</button>
        <button class="round-button" onclick="handleMuteClick(event)">
          <img id="muteIcon" src="graphics/icons/sound-on.svg" alt="Ton ausschalten" />
        </button>
      </div>
    </div>

    <div class="rotate-hint">
      <span class="rotate-icon">&#10227;</span>
      <p>Bitte dreh dein Gerät ins Querformat</p>
    </div>

    <dialog id="controlsDialog">
      <button class="close-button" onclick="closeControls()" aria-label="Schließen">&#10005;</button>
      <h2>Steuerung</h2>
      <div class="control-row">
        <img class="key-arrows" src="graphics/6.Botones/Key/arrow keys.png" alt="Pfeiltasten" />
        <span>Schwimmen</span>
      </div>
      <div class="control-row">
        <img src="graphics/6.Botones/Key/D key.png" alt="Taste D" />
        <span>Schwanzattacke gegen Kugelfische</span>
      </div>
      <div class="control-row">
        <img src="graphics/6.Botones/Key/Space Bar key.png" alt="Leertaste" />
        <span>Blase schießen: besiegt Quallen und den Wal</span>
      </div>
    </dialog>
  </body>
</html>
